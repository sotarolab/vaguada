[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "camanchaca-demo"
version = "0.1.0"
description = "Station-level daily high and low forecasts, stored before settlement and scored nightly against the official climate report, the raw models and the NWS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas>=2,<3",
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "psycopg[binary]>=3.1",
    "pandera>=0.20",
]

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn[standard]", "alembic>=1.13"]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.1,<3",
    "pandas-stubs",
    "alembic>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ"]

[tool.mypy]
mypy_path = "src"
python_version = "3.11"
strict = true
warn_unreachable = true
ignore_missing_imports = true
