[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vaguada"
version = "0.2.0"
description = "A public ledger of station daily high and low forecasts, scored every day against the NWS climate report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy", "pandas>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10", "pandas-stubs"]

[tool.setuptools]
packages = ["vaguada", "vaguada.parsers"]
include-package-data = true

[tool.setuptools.package-data]
vaguada = ["stations.csv"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
